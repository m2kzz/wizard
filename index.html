<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wizard Block & App</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 15px; max-width: 600px; margin: 0 auto; }
    
    h1, h2, h3 { text-align: center; margin-bottom: 15px; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    
    label { display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px; }
    input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: var(--text); font-size: 1rem; margin-bottom: 10px; }
    
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--accent); color: #000; font-weight: bold; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #334155; color: var(--text); margin-top: 10px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
    .player-input-group { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; }
    
    /* Warnmeldung-Banner */
    .alert-banner { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #fca5a5; padding: 12px; border-radius: 8px; margin-top: 10px; text-align: center; font-weight: 500; }
    .info-banner { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--warning); color: #fde047; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; text-align: center; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    th, td { padding: 8px; text-align: center; border-bottom: 1px solid #334155; }
    th { color: var(--accent); }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h1>🧙‍♂️ Wizard Keeper</h1>

  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="card">
    <h2>Neues Spiel starten</h2>
    <label for="player-count">Anzahl Spieler (3–6):</label>
    <input type="number" id="player-count" min="3" max="6" value="4">
    <button onclick="generatePlayerInputs()">Spieler eintragen</button>

    <div id="player-names-container" class="hidden" style="margin-top: 15px;">
      <div id="name-inputs"></div>
      <button onclick="startGame()">Spiel starten</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="card hidden">
    <h2 id="round-header">Runde 1 (1 Karte)</h2>
    
    <!-- PHASE 1: ANSAGEN -->
    <div id="bidding-phase">
      <h3>1. Stich-Ansagen</h3>
      <div id="bidding-inputs" class="grid"></div>
      
      <!-- Live Warnmeldung bezüglich Regelverstoß -->
      <div id="rule-warning" class="alert-banner hidden"></div>
      
      <button id="btn-submit-bids" style="margin-top: 15px;" onclick="confirmBids()">Ansagen bestätigen</button>
    </div>

    <!-- PHASE 2: ERGEBNISSE -->
    <div id="result-phase" class="hidden">
      <h3>2. Gemachte Stiche</h3>
      <div id="result-inputs" class="grid"></div>
      <div id="result-warning" class="alert-banner hidden"></div>
      <button style="margin-top: 15px;" onclick="confirmResults()">Runde auswerten</button>
    </div>
  </div>

  <!-- SCOREBOARD -->
  <div id="scoreboard-screen" class="card hidden">
    <h2>Punktestand</h2>
    <table>
      <thead>
        <tr id="table-head"></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    <button class="btn-secondary" onclick="resetGame()">Neues Spiel</button>
  </div>

  <script>
    let state = {
      players: [],
      currentRound: 1,
      maxRounds: 0,
      bids: [],
      scores: {}, // { SpielerName: gesamtPunkte }
      history: [] // Runden-Protokoll
    };

    // Spiel-Initialisierung
    function generatePlayerInputs() {
      const count = parseInt(document.getElementById('player-count').value);
      const container = document.getElementById('name-inputs');
      container.innerHTML = '';

      for (let i = 1; i <= count; i++) {
        container.innerHTML += `
          <label>Spieler ${i}:</label>
          <input type="text" class="player-name-input" value="Spieler ${i}">
        `;
      }
      document.getElementById('player-names-container').classList.remove('hidden');
    }

    function startGame() {
      const inputs = document.querySelectorAll('.player-name-input');
      state.players = Array.from(inputs).map(i => i.value.trim() || 'Unbenannt');
      state.maxRounds = Math.floor(60 / state.players.length);
      state.currentRound = 1;
      state.history = [];
      
      state.players.forEach(p => state.scores[p] = 0);

      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      document.getElementById('scoreboard-screen').classList.remove('hidden');

      renderTableHeaders();
      startRound();
    }

    // Runden-Steuerung
    function startRound() {
      const cardsInRound = state.currentRound;
      document.getElementById('round-header').innerText = `Runde ${state.currentRound} von ${state.maxRounds} (${cardsInRound} ${cardsInRound === 1 ? 'Karte' : 'Karten'})`;
      
      document.getElementById('bidding-phase').classList.remove('hidden');
      document.getElementById('result-phase').classList.add('hidden');
      document.getElementById('rule-warning').classList.add('hidden');

      // Bidding Inputs erzeugen
      const bidsDiv = document.getElementById('bidding-inputs');
      bidsDiv.innerHTML = '';
      
      state.players.forEach((player, idx) => {
        bidsDiv.innerHTML += `
          <div class="player-input-group">
            <label>${player} ${idx === state.players.length - 1 ? '👑 (Letzter)' : ''}</label>
            <input type="number" min="0" max="${cardsInRound}" class="bid-input" data-index="${idx}" oninput="validateBids()">
          </div>
        `;
      });

      validateBids();
    }

    // CORE LOGIK: Dynamische Validierung für den letzten Spieler
    function validateBids() {
      const inputs = Array.from(document.querySelectorAll('.bid-input'));
      const cardsInRound = state.currentRound;
      const totalPlayers = state.players.length;
      const warningBox = document.getElementById('rule-warning');
      const submitBtn = document.getElementById('btn-submit-bids');

      let filledCount = 0;
      let sumFirstPlayers = 0;

      // Summe der ersten (N-1) Spieler berechnen
      for (let i = 0; i < totalPlayers - 1; i++) {
        const val = inputs[i].value;
        if (val !== '') {
          filledCount++;
          sumFirstPlayers += parseInt(val, 10);
        }
      }

      // Prüfen, ob der letzte Spieler an der Reihe ist
      const lastInput = inputs[totalPlayers - 1];
      const verboteneZahl = cardsInRound - sumFirstPlayers;
      const isForbiddenValid = verboteneZahl >= 0 && verbotenerStichIsPossible(verboteneZahl, cardsInRound);

      let hasRuleViolation = false;

      // Wenn die Vorletzten eingegeben wurden, bestimmen wir die Regel
      if (filledCount === totalPlayers - 1 && isForbiddenValid) {
        const lastVal = lastInput.value !== '' ? parseInt(lastInput.value, 10) : null;

        if (lastVal === verboteneZahl) {
          hasRuleViolation = true;
          warningBox.innerHTML = `⚠️ <strong>Regelverstoß!</strong> ${state.players[totalPlayers - 1]} darf nicht genau <strong>${verboteneZahl}</strong> ansagen (Summe aller Ansagen darf nicht ${cardsInRound} sein).`;
          warningBox.classList.remove('hidden');
        } else {
          warningBox.innerHTML = `ℹ️ <strong>Hinweis für ${state.players[totalPlayers - 1]}:</strong> Du darfst <strong>nicht ${verboteneZahl}</strong> ansagen!`;
          warningBox.classList.remove('hidden');
        }
      } else {
        warningBox.classList.add('hidden');
      }

      // Button sperren, falls Regel verletzt ist oder nicht alle Felder ausgefüllt sind
      const allFilled = inputs.every(i => i.value !== '');
      submitBtn.disabled = !allFilled || hasRuleViolation;
    }

    function verbotenerStichIsPossible(val, maxCards) {
      return val >= 0 && val <= maxCards;
    }

    function confirmBids() {
      const inputs = document.querySelectorAll('.bid-input');
      state.bids = Array.from(inputs).map(i => parseInt(i.value, 10));

      // Wechsel zu Phase 2: Gemachte Stiche
      document.getElementById('bidding-phase').classList.add('hidden');
      document.getElementById('result-phase').classList.remove('hidden');

      const resDiv = document.getElementById('result-inputs');
      resDiv.innerHTML = '';
      
      state.players.forEach((player, idx) => {
        resDiv.innerHTML += `
          <div class="player-input-group">
            <label>${player} (Ansage: ${state.bids[idx]})</label>
            <input type="number" min="0" max="${state.currentRound}" class="result-input">
          </div>
        `;
      });
    }

    function confirmResults() {
      const inputs = Array.from(document.querySelectorAll('.result-input'));
      const results = inputs.map(i => parseInt(i.value || 0, 10));
      const cardsInRound = state.currentRound;
      const warningBox = document.getElementById('result-warning');

      // Validierung: Summe gemachte Stiche MUSS genau der Kartenanzahl entsprechen
      const sumResults = results.reduce((a, b) => a + b, 0);
      if (sumResults !== cardsInRound) {
        warningBox.innerText = `⚠️ Summe der gemachten Stiche muss genau ${cardsInRound} ergeben (aktuell: ${sumResults}).`;
        warningBox.classList.remove('hidden');
        return;
      }
      warningBox.classList.add('hidden');

      // Punkte berechnen & Kontostände aktualisieren
      let roundScores = {};
      state.players.forEach((player, idx) => {
        const bid = state.bids[idx];
        const made = results[idx];
        let diff = Math.abs(bid - made);
        let points = 0;

        if (diff === 0) {
          points = 20 + (made * 10);
        } else {
          points = -(diff * 10);
        }

        state.scores[player] += points;
        roundScores[player] = state.scores[player];
      });

      state.history.push({ round: state.currentRound, scores: { ...roundScores } });
      updateScoreboard();

      // Nächste Runde oder Spielende
      if (state.currentRound < state.maxRounds) {
        state.currentRound++;
        // Dealer-Rotation: Ersten Spieler ans Ende schieben
        state.players.push(state.players.shift());
        startRound();
      } else {
        alert("🎉 Spiel beendet! Gewonnen hat: " + getWinner());
      }
    }

    // Scoreboard UI
    function renderTableHeaders() {
      const tr = document.getElementById('table-head');
      tr.innerHTML = '<th>Runde</th>';
      state.players.forEach(p => tr.innerHTML += `<th>${p}</th>`);
    }

    function updateScoreboard() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      state.history.forEach(h => {
        let row = `<tr><td>${h.round}</td>`;
        // Richtige Reihenfolge beibehalten
        Object.keys(state.scores).forEach(p => {
          row += `<td>${h.scores[p] !== undefined ? h.scores[p] : '-'}</td>`;
        });
        row += '</tr>';
        tbody.innerHTML += row;
      });
    }

    function getWinner() {
      return Object.entries(state.scores).sort((a,b) => b[1] - a[1])[0][0];
    }

    function resetGame() {
      document.getElementById('setup-screen').classList.remove('hidden');
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('scoreboard-screen').classList.add('hidden');
    }
  </script>
</body>
</html>
